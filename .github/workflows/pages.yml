name: EarthBeat Observatory — NASA data and GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 24
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install media decoding tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg curl
      - name: Check science mapping and deterministic tests
        run: |
          node --check src/observatory.js
          node --check src/sonification.js
          node --check src/playback.js
          node --test tests/*.test.js
      - name: Generate 12 official NASA night lights images
        run: bash scripts/prepare_nasa.sh
      - name: Generate six original NASA visualizations
        run: bash scripts/prepare_observatory.sh
      - name: Verify all scientific media before deployment
        run: |
          set -euo pipefail
          for year in {2012..2023}; do test -s "assets/nightlights/$year.webp"; done
          for id in ocean carbon forest; do for n in {1..8}; do test -s "$(printf 'assets/observatory/%s/%02d.webp' "$id" "$n")"; done; done
          for id in aerosols lightning; do test -s "assets/observatory/$id/01.webp"; done
          echo "All 38 frames are from original NASA media."
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Allow artifact indexing
        run: sleep 20
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
